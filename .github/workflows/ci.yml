name: EventFlow CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: EventFlow/package-lock.json

      - name: Install dependencies
        working-directory: ./EventFlow
        run: npm ci

      - name: Run Test Suite
        working-directory: ./EventFlow
        env:
          NODE_ENV: test
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/eventflow_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test
